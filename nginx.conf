events {}

http {
    upstream api_backend {
        # docker-compose's embedded DNS resolves `api` to ALL scaled replicas,
        # so nginx round-robins across however many containers are up.
        server api:8000;
    }

    server {
        listen 80;

        client_max_body_size 50M;  # allow zip uploads for /retrain

        location / {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }
    }
}
