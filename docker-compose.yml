services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://nginx:80
    depends_on:
      - nginx